{#- Controles "Desde / Hasta" para seleccionar folios por rango (static/js/seleccion_rango.js).
    con_sugerido: muestra el botón "Usar sugerido" (lo maneja el script de la página). -#}
<div class="row g-2 align-items-end mb-1" id="rango-controles">
    <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="rango-desde">Desde</label>
        <input type="number" min="1" step="1" inputmode="numeric" id="rango-desde"
               class="form-control form-control-sm" placeholder="N.º folio" autocomplete="off">
    </div>
    <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="rango-hasta">Hasta</label>
        <input type="number" min="1" step="1" inputmode="numeric" id="rango-hasta"
               class="form-control form-control-sm" placeholder="N.º folio" autocomplete="off">
    </div>
    <div class="col-auto">
        <button type="button" class="btn btn-sm btn-outline-primary" id="rango-aplicar">
            <i class="fas fa-arrows-left-right me-1" aria-hidden="true"></i>Seleccionar rango
        </button>
    </div>
    {% if con_sugerido %}
    <div class="col-auto">
        <button type="button" class="btn btn-sm btn-outline-success d-none" id="usar-sugerido">
            <i class="fas fa-lightbulb me-1" aria-hidden="true"></i><span>Usar sugerido</span>
        </button>
    </div>
    {% endif %}
</div>
<small id="rango-msg" class="d-block small mb-2" aria-live="polite"></small>
